# KJDM OpenJarvis Configuration
# Drop this file at: ~/.openjarvis/config.yaml
# Then run: jarvis skill install kljj365/kjdm-jarvis && jarvis gui

# Engine: Anthropic Claude cloud + local fallback
engine:
  provider: anthropic
  model: claude-3-5-haiku-20241022
  fallback_to_local: true
  local_model: qwen3:8b

# KJDM Brand Theme
theme: kjdm
custom_css: ~/.openjarvis/themes/kjdm.css

# Active skills
skills:
  - kljj365/kjdm-jarvis

# Scheduled agents (CDT = UTC-5)
agents:
  - name: kjdm_daily_outreach
    module: kjdm_jarvis.agents.daily_outreach
    function: run_daily_outreach
    cron: "0 9 * * *"
    timezone: America/Chicago
    description: Pull new leads and fire outreach SMS

  - name: kjdm_pipeline_monitor
    module: kjdm_jarvis.agents.pipeline_monitor
    function: run_pipeline_monitor
    cron: "0 8 * * *"
    timezone: America/Chicago
    description: Daily pipeline health + stale deal alerts

  - name: kjdm_content_creator
    module: kjdm_jarvis.agents.content_creator
    function: run_content_creator
    cron: "0 7 * * *"
    timezone: America/Chicago
    description: Generate and schedule tonight's 9 PM social post

# Memory
memory:
  persist: true

# Telemetry
telemetry:
  enabled: true
  track_cost: true
  track_latency: true

# Desktop UI
gui:
  port: 8000
  open_on_start: true
  window_title: "KJDM Jarvis"
