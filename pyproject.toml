[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kjdm-jarvis"
version = "1.0.0"
description = "KJDM OpenJarvis Integration — CRM tools, agents, and brand theme"
authors = [{name = "Kyle Johnson", email = "kyle.l.j.johnson@kljj365.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.urls]
Homepage = "https://kljj365.com"
Repository = "https://github.com/kljj365/kjdm-jarvis"

[tool.ruff]
line-length = 100
target-version = "py311"
